<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supplementary figures | ICA 2026</title>
  <link rel="stylesheet" href="figure-brightness.css">
  <style>
    :root { color-scheme: light; }
    body { margin:0; border-top:7px solid #142b49; background:#f3f7fb; color:#142b49; font:1rem/1.5 system-ui,sans-serif; }
    main { max-width:76rem; margin:auto; padding:1rem clamp(.7rem,3vw,2rem) 2rem; }
    h1 { margin:.6rem 0 1.3rem; font-size:clamp(1.5rem,4vw,2.5rem); line-height:1.15; }
    a { color:#096b77; text-underline-offset:.18em; }
    a:focus-visible { outline:3px solid #00889a; outline-offset:3px; }
    figure { margin:0 0 1.5rem; scroll-margin-top:1rem; background:white; border:1px solid #dce5ef; border-radius:.5rem; overflow:hidden; }
    figcaption { padding:.65rem 1rem; font-weight:700; border-bottom:1px solid #dce5ef; }
    img { display:block; width:100%; height:auto; }
    @supports selector(main:has(figure:target)) {
      main:has(figure:target) figure:not(:target) { display:none; }
    }
  </style>
</head>
<body>
  <main>
    <a href="./">Back to the poster supplement</a>
    <h1>Supplementary figures</h1>
    <figure id="s1">
      <figcaption>S1 · COI phylogeny</figcaption>
      <img class="figure-s1" src="figure-1.jpg" width="1667" height="1200" alt="Supplementary figure S1, showing the COI phylogeny with highlighted Sinopoda clivus vouchers." loading="lazy">
    </figure>
    <figure id="s2">
      <figcaption>S2 · Sampling map</figcaption>
      <img class="figure-s2" src="figure-2.jpg" width="1667" height="1200" alt="Supplementary figure S2, showing the overview sampling map and the southern coast and Jeju detail." loading="lazy">
    </figure>
    <figure id="s3">
      <figcaption>S3 · SKG morphometrics</figcaption>
      <img class="figure-s3" src="figure-3.jpg" width="1667" height="1200" alt="Supplementary figure S3, showing landmark examples, four t-SNE plots for the ventral male palp, RTA, epigyne, and vulva, and selected Procrustes results." loading="lazy">
    </figure>
  </main>
</body>
</html>
